[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#0b0d12"
secondaryBackgroundColor = "#161a24"
textColor = "#e8e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
# Behind Cloud Run / reverse proxies; also set via Dockerfile.frontend ENV.
enableCORS = false
enableXsrfProtection = false
